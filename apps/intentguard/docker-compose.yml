services:
  intentguard-gateway:
    build: .
    ports:
      - "8787:8787"
    environment:
      DOCKER: "1"
      INTENTGUARD_PORT: "8787"
      INTENTGUARD_DATA_DIR: /data/.intentguard
      # INTENTGUARD_OWNER_API_KEY: set in .env
      # INTENTGUARD_EXECUTE: "1"
      # INTENTGUARD_OWNER_PRIVATE_KEY_HEX: set in .env (never commit)
    volumes:
      - intentguard-data:/data/.intentguard
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health/ready').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  intentguard-data:
